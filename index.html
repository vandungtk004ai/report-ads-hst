<title>HST Ads Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root {
  --bg:#EDE8DC;--bg2:#E3DDD0;--surf:#FAF7F1;--surf2:#F2EDE4;
  --brand:#1B3C2A;--brand2:#2B5240;--gold:#9C7218;--gold2:#BF8E24;
  --text:#17150F;--text2:#524A3F;--text3:#888070;
  --bdr:#CCC3AF;--bdr2:#DDD6C4;
  --ok:#1A6638;--warn:#8C5C14;--bad:#A02C1E;
  --side:#12271A;--side-txt:rgba(238,228,200,.78);--side-act:rgba(255,255,255,.12);
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.04);
  --r:8px;--r-lg:12px;--r-sm:4px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101810;--bg2:#182016;--surf:#1A2618;--surf2:#212E1E;
  --brand:#3A6848;--brand2:#4A8058;--gold:#CC9E38;--gold2:#E4B850;
  --text:#EAE4D2;--text2:#968E7C;--text3:#5C5448;
  --bdr:#263823;--bdr2:#1C2C1A;
  --ok:#36B866;--warn:#CC9820;--bad:#D84830;
  --side:#0C140E;--side-txt:rgba(220,210,182,.76);
  --shadow:0 1px 4px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
}}
:root[data-theme="dark"]{
  --bg:#101810;--bg2:#182016;--surf:#1A2618;--surf2:#212E1E;
  --brand:#3A6848;--brand2:#4A8058;--gold:#CC9E38;--gold2:#E4B850;
  --text:#EAE4D2;--text2:#968E7C;--text3:#5C5448;
  --bdr:#263823;--bdr2:#1C2C1A;
  --ok:#36B866;--warn:#CC9820;--bad:#D84830;
  --side:#0C140E;--side-txt:rgba(220,210,182,.76);
  --shadow:0 1px 4px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.55;min-height:100vh;}
h1,h2,h3,.hd{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:600;}
button{cursor:pointer;font-family:'Inter',system-ui,sans-serif;}

/* ── AUTH ── */
#auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.auth-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:40px 44px;width:380px;box-shadow:var(--shadow);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-mark{width:54px;height:54px;background:var(--brand);border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:21px;color:#D4B060;margin-bottom:11px;}
.auth-ttl{font-family:'Be Vietnam Pro',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px;}
.auth-sub{color:var(--text3);font-size:12.5px;}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh;}
#sidebar{width:236px;min-height:100vh;background:var(--side);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{height:52px;background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 24px;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:10;}
#content{flex:1;overflow-y:auto;padding:24px;}

/* ── SIDEBAR ── */
.s-brand{padding:18px 15px 15px;border-bottom:1px solid rgba(255,255,255,.07);}
.s-brand-name{font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:14.5px;color:#C4A040;letter-spacing:.02em;}
.s-brand-sub{font-size:10.5px;color:var(--side-txt);opacity:.65;margin-top:1px;}
.s-sec{padding:6px 0;}
.s-lbl{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(220,208,175,.38);padding:8px 15px 3px;}
.s-item{display:flex;align-items:center;gap:9px;padding:7.5px 15px;color:var(--side-txt);border:none;background:none;width:100%;text-align:left;font-size:13px;font-family:'Inter',sans-serif;transition:background .12s;border-radius:0;}
.s-item:hover{background:rgba(255,255,255,.06);}
.s-item.on{background:var(--side-act);color:#EEE4C8;font-weight:500;}
.s-item svg{width:15px;height:15px;opacity:.65;flex-shrink:0;}
.s-item.on svg{opacity:1;}
.s-sub{padding:5.5px 15px 5.5px 39px;font-size:12.5px;color:var(--side-txt);border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;transition:background .12s;}
.s-sub:hover{background:rgba(255,255,255,.05);}
.s-sub.on{color:#E8D888;font-weight:500;}
.s-hr{height:1px;background:rgba(255,255,255,.06);margin:3px 0;}
.s-foot{margin-top:auto;padding:10px 15px;border-top:1px solid rgba(255,255,255,.05);}
.s-user{display:flex;align-items:center;gap:9px;padding:7px 0;}
.s-av{width:30px;height:30px;background:var(--brand2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#C8A040;flex-shrink:0;}
.s-uname{color:rgba(238,228,200,.82);font-size:12.5px;font-weight:500;}
.s-urole{font-size:10.5px;color:rgba(220,208,175,.45);}
.s-logout{display:flex;align-items:center;gap:6px;padding:5px 0;color:rgba(220,208,175,.45);font-size:12px;border:none;background:none;width:100%;text-align:left;transition:color .12s;}
.s-logout:hover{color:rgba(220,208,175,.8);}

/* ── TOP BAR ── */
.top-ttl{font-family:'Be Vietnam Pro',sans-serif;font-size:15.5px;font-weight:600;color:var(--text);flex:1;}
.week-sel{display:flex;align-items:center;gap:6px;}
.week-sel select,.week-sel input{background:var(--surf2);border:1px solid var(--bdr);color:var(--text);padding:5px 9px;border-radius:var(--r-sm);font-size:12.5px;font-family:'Inter',sans-serif;}

/* ── FORMS ── */
.fg{margin-bottom:15px;}
.lbl{display:block;margin-bottom:4px;font-size:12px;font-weight:500;color:var(--text2);}
.inp,.sel{width:100%;background:var(--surf2);border:1px solid var(--bdr);color:var(--text);padding:8px 11px;border-radius:var(--r);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus,.sel:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(43,82,64,.12);}
.inp::placeholder{color:var(--text3);}
textarea.inp{resize:vertical;min-height:80px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;border:1px solid transparent;transition:all .14s;white-space:nowrap;}
.btn-p{background:var(--brand);color:#E0C880;border-color:var(--brand);}
.btn-p:hover{background:var(--brand2);}
.btn-s{background:var(--surf);color:var(--text);border-color:var(--bdr);}
.btn-s:hover{background:var(--surf2);}
.btn-d{background:var(--bad);color:#fff;border-color:var(--bad);}.btn-d:hover{opacity:.85;}
.btn-sm{padding:5px 11px;font-size:12px;}

/* ── ALERTS ── */
.alert{padding:10px 13px;border-radius:var(--r);font-size:12.5px;margin-bottom:12px;}
.alert-e{background:rgba(160,44,30,.1);color:var(--bad);border:1px solid rgba(160,44,30,.2);}
.alert-s{background:rgba(26,102,56,.1);color:var(--ok);border:1px solid rgba(26,102,56,.2);}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-ttl{font-family:'Be Vietnam Pro',sans-serif;font-size:13.5px;font-weight:600;}

/* ── KPI TILES ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:20px;}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow);}
.kpi-lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.kpi-val{font-family:'Be Vietnam Pro',sans-serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.kpi-g .kpi-val{color:var(--ok);}
.kpi-w .kpi-val{color:var(--warn);}
.kpi-b .kpi-val{color:var(--gold2);}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);background:var(--surf2);padding:9px 11px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap;user-select:none;}
th.sortable{cursor:pointer;}
th.sortable:hover{color:var(--text2);}
th.sorted{color:var(--gold2);}
th.r,td.r{text-align:right;}
td{padding:8px 11px;border-bottom:1px solid var(--bdr2);color:var(--text);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surf2);}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;}
.badge-g{background:rgba(26,102,56,.12);color:var(--ok);}
.badge-y{background:rgba(140,92,20,.12);color:var(--warn);}
.badge-r{background:rgba(160,44,30,.12);color:var(--bad);}
.badge-b{background:rgba(50,100,200,.1);color:#3060B8;}
.badge-gray{background:var(--bg2);color:var(--text3);}

/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bdr);margin-bottom:20px;}
.tab{padding:8px 15px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}

/* ── CHIPS ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--bdr);background:var(--surf);color:var(--text2);font-size:12px;font-weight:500;transition:all .12s;}
.chip:hover{border-color:var(--brand2);color:var(--brand2);}
.chip.on{background:var(--brand);color:#E4CC80;border-color:var(--brand);}

/* ── UPLOAD ZONE ── */
.drop-zone{border:2px dashed var(--bdr);border-radius:var(--r-lg);padding:36px;text-align:center;background:var(--surf2);transition:all .15s;}
.drop-zone:hover,.drop-zone.drag{border-color:var(--brand2);background:rgba(43,82,64,.06);}
.dz-icon{font-size:26px;margin-bottom:8px;}
.dz-txt{font-size:13.5px;font-weight:500;color:var(--text2);}
.dz-sub{font-size:11.5px;color:var(--text3);margin-top:3px;}

/* ── PRODUCT BLOCKS ── */
.prod-block{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.prod-hd{display:flex;align-items:center;padding:13px 17px;cursor:pointer;gap:12px;transition:background .12s;}
.prod-hd:hover{background:var(--surf2);}
.prod-name{font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:14px;}
.prod-stats{display:flex;gap:20px;margin-left:auto;}
.pstat{text-align:right;}
.pstat-v{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;}
.pstat-l{font-size:10px;color:var(--text3);}
.prod-body{padding:0 17px 14px;display:none;}
.prod-body.open{display:block;}
.expand-icon{margin-left:auto;color:var(--text3);transition:transform .2s;font-size:13px;}
.prod-hd.open .expand-icon{transform:rotate(180deg);}

/* ── MISC ── */
.section-ttl{font-family:'Be Vietnam Pro',sans-serif;font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:13px;display:flex;align-items:center;gap:8px;}
.section-ttl small{font-size:11.5px;color:var(--text3);font-weight:400;}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.mt-4{margin-top:4px;}.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}.mt-20{margin-top:20px;}
.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}
.flex-row{display:flex;align-items:center;gap:8px;}
.flex-1{flex:1;}
.muted{color:var(--text3);}
.bold{font-weight:600;}
.small{font-size:11.5px;}
.link{color:var(--gold2);text-decoration:none;}
.link:hover{text-decoration:underline;}
.empty{text-align:center;padding:48px 24px;color:var(--text3);}
.empty-ttl{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.loading-txt{text-align:center;padding:40px;color:var(--text3);}
.divider{height:1px;background:var(--bdr2);margin:16px 0;}
.roas-bar{height:5px;background:var(--bg2);border-radius:3px;margin-top:4px;overflow:hidden;}
.roas-fill{height:100%;border-radius:3px;background:var(--gold2);}
.roas-fill.g{background:var(--ok);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:26px 30px;min-width:380px;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto;}
.modal-ttl{font-family:'Be Vietnam Pro',sans-serif;font-size:16px;font-weight:700;margin-bottom:18px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--bdr2);}
</style>

<!-- AUTH -->
<div id="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-mark">H</div>
      <div class="auth-ttl">HST Ads Report</div>
      <div class="auth-sub">Báo cáo quảng cáo Meta Ads</div>
    </div>
    <div id="auth-alert"></div>
    <div id="auth-form">
      <div class="fg">
        <label class="lbl">Tên đăng nhập</label>
        <input class="inp" id="inp-user" type="text" placeholder="username" autocomplete="username">
      </div>
      <div class="fg">
        <label class="lbl">Mật khẩu</label>
        <input class="inp" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-p" style="width:100%;justify-content:center;" onclick="doLogin()">Đăng nhập</button>
    </div>
    <div id="setup-form" style="display:none;">
      <p class="small muted mb-12">Chưa có tài khoản nào. Tạo tài khoản quản trị đầu tiên:</p>
      <div class="fg"><label class="lbl">Họ tên</label><input class="inp" id="su-name" type="text" placeholder="Nguyễn Văn A"></div>
      <div class="fg"><label class="lbl">Tên đăng nhập</label><input class="inp" id="su-user" type="text" placeholder="admin"></div>
      <div class="fg"><label class="lbl">Mật khẩu</label><input class="inp" id="su-pass" type="password" placeholder="Ít nhất 6 ký tự"></div>
      <button class="btn btn-p" style="width:100%;justify-content:center;" onclick="doSetup()">Tạo tài khoản & Bắt đầu</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" hidden>
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="s-brand">
      <div class="s-brand-name">HST Ads Report</div>
      <div class="s-brand-sub">Hồ Shan Trà</div>
    </div>

    <div class="s-sec">
      <div class="s-lbl">Báo cáo</div>
      <button class="s-item" data-nav="overview" onclick="goNav('overview')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Tổng quan
      </button>
      <button class="s-item" data-nav="by-product" onclick="goNav('by-product')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l3 2"/></svg>
        Theo sản phẩm
      </button>
      <button class="s-item" data-nav="by-mkt" onclick="goNav('by-mkt')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="3"/><circle cx="12" cy="5" r="2"/><path d="M1 13c0-2.2 2.2-4 5-4s5 1.8 5 4"/><path d="M12 7c1.7 0 3 1.2 3 2.8"/></svg>
        Theo MKT
      </button>
      <button class="s-item" data-nav="by-video" onclick="goNav('by-video')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="10" height="10" rx="1"/><path d="M11 6l4-2v8l-4-2"/></svg>
        Theo video
      </button>
    </div>

    <div class="s-hr"></div>
    <div class="s-sec">
      <div class="s-lbl">Dữ liệu</div>
      <button class="s-item" data-nav="upload" onclick="goNav('upload')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2M5 5l3-3 3 3"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>
        Upload CSV
      </button>
    </div>

    <div class="s-hr"></div>
    <div class="s-sec">
      <div class="s-lbl">Cài đặt</div>
      <button class="s-item" data-nav="cfg-products" onclick="goNav('cfg-products')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4h14M1 8h10M1 12h7"/></svg>
        Sản phẩm & Giá
      </button>
      <button class="s-item" data-nav="cfg-drive" onclick="goNav('cfg-drive')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l7 4-7 4-7-4z"/><path d="M1 9l7 4 7-4"/></svg>
        Drive Links
      </button>
      <button class="s-item admin-only" data-nav="cfg-users" onclick="goNav('cfg-users')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
        Tài khoản
      </button>
    </div>

    <div class="s-foot">
      <div class="s-user">
        <div class="s-av" id="s-av">A</div>
        <div>
          <div class="s-uname" id="s-uname">—</div>
          <div class="s-urole" id="s-urole">—</div>
        </div>
      </div>
      <button class="s-logout" onclick="doLogout()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3H3a1 1 0 00-1 1v8a1 1 0 001 1h3M11 11l3-3-3-3M14 8H6"/></svg>
        Đăng xuất
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div id="main">
    <div id="topbar">
      <div class="top-ttl" id="page-ttl">Tổng quan</div>
      <div class="week-sel" id="week-bar">
        <span class="small muted">Tuần:</span>
        <select id="week-select" onchange="onWeekChange(this.value)">
          <option value="">-- Chọn tuần --</option>
        </select>
      </div>
      <button class="btn btn-s btn-sm" onclick="refreshData()">↻ Làm mới</button>
    </div>
    <div id="content">
      <div class="loading-txt">Đang tải...</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function sha256(str){
  // Pure-JS hash — synchronous, consistent across all environments
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h<<5)+h)^str.charCodeAt(i);h=h|0;}
  return 'h'+(h>>>0).toString(16).padStart(8,'0')+'x'+str.length+'z';
}
const fVND=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0))+'₫';
const fNum=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0));
const fPct=n=>((n||0)*100).toFixed(2)+'%';
const fRoas=n=>(n||0).toFixed(2)+'x';
function parseNum(v){if(!v&&v!==0)return 0;if(typeof v==='number')return v;return parseFloat(String(v).replace(/[^\d.-]/g,''))||0;}
function safeId(str){return String(str).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').replace(/[^a-zA-Z0-9_\-.~:@+]/g,'_').slice(0,80)||'x';}
function parsePct(v){const s=String(v||0).trim();if(s.endsWith('%'))return parseFloat(s)/100;const n=parseNum(v);return n>1?n/100:n;}
function isoWeek(dateStr){
  try{
    const d=new Date(dateStr);if(isNaN(d))return '';
    const thu=new Date(d);thu.setDate(d.getDate()-((d.getDay()+6)%7)+3);
    const jan4=new Date(thu.getFullYear(),0,4);
    const w=1+Math.round((thu-jan4)/604800000);
    return `${thu.getFullYear()}-W${String(w).padStart(2,'0')}`;
  }catch{return '';}
}
function weekLabel(w){
  if(!w)return '';
  const [y,ww]=w.split('-W');
  const d=new Date(parseInt(y),0,1+(parseInt(ww)-1)*7);
  d.setDate(d.getDate()-d.getDay()+1);
  const e=new Date(d);e.setDate(d.getDate()+6);
  const fmt=dt=>dt.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  return `${w} (${fmt(d)}–${fmt(e)})`;
}
function normCode(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'D').toUpperCase().trim();
}
function parseAdName(n){
  const prods=(S.products.length?S.products:PRODUCTS_DEF);
  const codes=prods.map(p=>p.code).sort((a,b)=>b.length-a.length);
  const u=String(n||'').trim();
  const un=normCode(u);
  for(const c of codes){
    if(u.startsWith(c+'_')||u.toUpperCase().startsWith(c.toUpperCase()+'_')||un.startsWith(normCode(c)+'_'))
      return{product:c,video:u.slice(c.length+1)};
  }
  const i=u.indexOf('_');
  if(i>0)return{product:u.slice(0,i).toUpperCase(),video:u.slice(i+1)};
  return{product:'UNKNOWN',video:u};
}
function clearSubs(){S.subs.forEach(fn=>fn());S.subs=[];}
function setAlert(id,msg,type='e'){const el=document.getElementById(id);if(el)el.innerHTML=msg?`<div class="alert alert-${type}">${msg}</div>`:'';}
function dbErrMsg(e){return e?.code?`[${e.code}] ${e.message||''}`:e?.message||String(e);}
function _cmEl(){let el=document.getElementById('confirm-modal');if(!el){el=document.createElement('div');el.id='confirm-modal';document.body.appendChild(el);}return el;}
function showConfirm(msg,onYes,okLabel='Xóa'){

      <button class="btn btn-d" onclick="document.getElementById('confirm-modal').innerHTML='';window._onConfirmYes&&window._onConfirmYes()">${okLabel}</button>
    </div></div></div>`;
}

(async()=>{
  try{

  }catch(e){
    document.getElementById('auth-alert').innerHTML=`<div class="alert alert-e">Lỗi khởi động: ${dbErrMsg(e)}</div>`;
  }
})();

async function checkFirstRun(){
  try{
    const snap=await S.db.doc('config/meta').get();
    if(snap.exists&&snap.data().initialized)return; // App set up → show login
    // Truly not initialized → show setup form
    document.getElementById('auth-form').style.display='none';
    document.getElementById('setup-form').style.display='block';
  }catch(e){
    // DB transient error — do NOT show setup form; let user retry
    setAlert('auth-alert',`Lỗi kết nối dữ liệu. <button class="btn btn-s" onclick="location.reload()" style="margin-left:6px;">Tải lại trang</button>`,'e');
  }
}

function showAuth(){
  document.getElementById('auth-wrap').removeAttribute('hidden');
  document.getElementById('app').setAttribute('hidden','');
}

async function doLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  if(!u||!p){setAlert('auth-alert','Vui lòng nhập đầy đủ thông tin.');return;}
  if(!/^[a-zA-Z0-9_.\-]{1,50}$/.test(u)){setAlert('auth-alert','Tên đăng nhập chỉ dùng chữ không dấu, số, dấu _ (không ký tự tiếng Việt).');return;}
  setAlert('auth-alert','');
  try{
    const h=await sha256(p);
    const snap=await S.db.doc(`users/${u}`).get();
    if(!snap.exists)throw new Error('Tài khoản không tồn tại');
    const ud=snap.data();
    const storedHash=ud.ph||ud.password_hash||'';
    if(storedHash!==h)throw new Error('Mật khẩu không đúng');
    S.user={id:u,name:ud.n||ud.name||u,role:ud.r||ud.role||'staff'};
    sessionStorage.setItem('hst_u',JSON.stringify(S.user));
    await loadApp();
  }catch(e){setAlert('auth-alert',dbErrMsg(e));}
}

async function doSetup(){
  const name=document.getElementById('su-name').value.trim();
  const user=document.getElementById('su-user').value.trim();
  const pass=document.getElementById('su-pass').value;
  if(!name||!user||!pass){setAlert('auth-alert','Vui lòng nhập đầy đủ.');return;}
  if(!/^[a-zA-Z0-9_.\-]{1,50}$/.test(user)){setAlert('auth-alert','Username chỉ dùng chữ không dấu, số, dấu _ (không ký tự tiếng Việt).');return;}
  if(pass.length<6){setAlert('auth-alert','Mật khẩu ít nhất 6 ký tự.');return;}
  setAlert('auth-alert','Đang tạo tài khoản...','s');
  try{
    if(!S.db)throw new Error('DB chưa sẵn sàng, vui lòng tải lại trang.');
    const h=await sha256(pass);
    await S.db.doc(`users/${user}`).set({n:name,ph:h,r:'admin',c:Date.now()});
    // Mark app as initialized so checkFirstRun shows login form for future visitors
    try{const ms=await S.db.doc('config/meta').get();const md=ms.exists?ms.data():{};await S.db.doc('config/meta').set({...md,initialized:true});}catch(e){}
    S.user={id:user,name,role:'admin'};
    sessionStorage.setItem('hst_u',JSON.stringify(S.user));
    await loadApp();
  }catch(e){setAlert('auth-alert',dbErrMsg(e));}
}

function doLogout(){
  sessionStorage.removeItem('hst_u');
  S.user=null;S.weekRows=[];S.weeks=[];clearSubs();
  document.getElementById('app').setAttribute('hidden','');
  document.getElementById('auth-wrap').removeAttribute('hidden');
  document.getElementById('auth-form').style.display='';
  document.getElementById('setup-form').style.display='none';
  document.getElementById('inp-user').value='';
  document.getElementById('inp-pass').value='';
}

async function loadApp(){
  document.getElementById('auth-wrap').setAttribute('hidden','');
  document.getElementById('app').removeAttribute('hidden');
  // sidebar user info
  document.getElementById('s-av').textContent=(S.user.name||'?')[0].toUpperCase();
  document.getElementById('s-uname').textContent=S.user.name||S.user.id;
  document.getElementById('s-urole').textContent=S.user.role==='admin'?'Quản trị':'Nhân viên';
  if(S.user.role!=='admin')document.querySelectorAll('.admin-only').forEach(el=>el.style.display='none');
  await Promise.all([loadProducts(),loadDriveLinks(),loadWeeks()]);
  if(S.week)await loadWeekData();
  goNav('overview');
}

async function loadWeeks(){
  const snap=await S.db.doc('config/meta').get();
  const meta=snap.exists?snap.data():{};
  S.weeks=(meta.weeks)?[...meta.weeks]:[];
  // Ensure initialized:true is always set if we have data
  if(S.weeks.length&&!meta.initialized){
    try{await S.db.doc('config/meta').set({...meta,initialized:true});}catch(e){}
  }
  // Fallback: scan reports if weeks list is empty but reports exist
  if(!S.weeks.length){
    const rsnap=await S.db.collection('reports').limit(50).get();
    if(!rsnap.empty){
      const weekSet=new Set(rsnap.docs.map(d=>d.data().week).filter(Boolean));
      S.weeks=[...weekSet];
      if(S.weeks.length){const md2=snap.exists?meta:{};await S.db.doc('config/meta').set({...md2,weeks:S.weeks,initialized:true});}
    }
  }
  S.weeks.sort((a,b)=>b.localeCompare(a));
  if(!S.week&&S.weeks.length)S.week=S.weeks[0];
  rebuildWeekSelect();
}

async function loadProducts(){
  const snap=await S.db.doc('config/products').get();
  if(snap.exists){
    const d=snap.data();
    if(Array.isArray(d.products_list)){
      S.products=d.products_list.map(p=>({...p,avg_order:parseNum(p.avg_order||0)}));
      return;
    }
    // Legacy format
    const saved=d.products||{};
    S.products=PRODUCTS_DEF.map(p=>{
      const s=saved[p.code]||{};
      return{...p,code:s.code||p.code,avg_order:parseNum(s.avg_order||0)};
    });
  }
}
async function loadDriveLinks(){
  const snap=await S.db.doc('config/drive_links').get();
  S.driveLinks=snap.exists?(snap.data().links||{}):{};
}

function rebuildWeekSelect(){
  const sel=document.getElementById('week-select');
  sel.innerHTML='<option value="">-- Chọn tuần --</option>'+S.weeks.map(w=>`<option value="${w}" ${w===S.week?'selected':''}>${weekLabel(w)}</option>`).join('');
}

async function onWeekChange(w){
  S.week=w;clearSubs();S.weekRows=[];
  if(w)await loadWeekData();
  else renderView();
}

async function loadWeekData(){
  if(!S.week)return;
  S.loading=true;renderView();
  try{
    const snap=await S.db.collection('reports').where('week','==',S.week).get();
    S.weekRows=[];
    snap.docs.forEach(d=>{
      const rows=d.data().rows||[];
      rows.forEach(r=>{S.weekRows.push({...r,_mkt:d.data().mkt||'?',_doc:d.id});});
    });
  }catch(e){console.error('loadWeekData error:',e);}
  S.loading=false;
  renderView();
}

async function refreshData(){
  await Promise.all([loadProducts(),loadDriveLinks(),loadWeeks()]);
  if(S.week)await loadWeekData();
  else renderView();
}

// ═══════════════════════════════════════════════
//  AGGREGATION
// ═══════════════════════════════════════════════
function findProduct(productCode){
  return S.products.find(x=>x.code===productCode)||
         S.products.find(x=>normCode(x.code)===normCode(productCode));
}
function getAvgOrder(productCode){
  const p=findProduct(productCode);
  return p?p.avg_order:0;
}
function calcRevenue(results,productCode){return results*getAvgOrder(productCode);}

function sumRows(rows){
  const r={impressions:0,reach:0,amount_spent:0,link_clicks:0,results:0,count:rows.length};
  rows.forEach(row=>{
    r.impressions+=parseNum(row.impressions);
    r.reach+=parseNum(row.reach);
    r.amount_spent+=parseNum(row.amount_spent);
    r.link_clicks+=parseNum(row.link_clicks);
    r.results+=parseNum(row.results);
  });
  r.cpm=r.impressions?r.amount_spent/(r.impressions/1000):0;
  r.cpc=r.link_clicks?r.amount_spent/r.link_clicks:0;
  // Use weighted average of stored CTR values (video ads have link_clicks=0 so can't recalculate)
  const totalImpForCtr=rows.reduce((s,row)=>s+parseNum(row.impressions),0);
  const weightedCtr=totalImpForCtr?rows.reduce((s,row)=>s+parseNum(row.ctr)*parseNum(row.impressions),0)/totalImpForCtr:0;
  r.ctr=weightedCtr||(r.impressions?r.link_clicks/r.impressions:0);
  r.cpr=r.results?r.amount_spent/r.results:0;
  return r;
}

function aggByProduct(rows){
  const map={};
  rows.forEach(r=>{
    const p=r.product||'UNKNOWN';
    if(!map[p])map[p]={product:p,rows:[]};
    map[p].rows.push(r);
  });
  return Object.values(map).map(g=>{
    const m=sumRows(g.rows);
    const revenue=calcRevenue(m.results,g.product);
    const roas=m.amount_spent?revenue/m.amount_spent:0;
    const info=findProduct(g.product)||PRODUCTS_DEF.find(p=>p.code===g.product)||PRODUCTS_DEF.find(p=>normCode(p.code)===normCode(g.product))||{label:g.product,color:'#666'};
    return{...m,product:g.product,label:info.label,color:info.color,revenue,roas,rows:g.rows};
  }).sort((a,b)=>b.revenue-a.revenue);
}

function aggByMKT(rows){
  const map={};
  rows.forEach(r=>{
    const m=r._mkt||'?';
    if(!map[m])map[m]={mkt:m,products:new Set(),rows:[]};
    map[m].rows.push(r);
    if(r.product)map[m].products.add(r.product);
  });
  return Object.values(map).map(g=>{
    const m=sumRows(g.rows);
    const revenue=g.rows.reduce((s,r)=>s+calcRevenue(parseNum(r.results),r.product),0);
    const roas=m.amount_spent?revenue/m.amount_spent:0;
    return{...m,mkt:g.mkt,products:[...g.products],revenue,roas};
  }).sort((a,b)=>b.revenue-a.revenue);
}

function aggByVideo(rows){
  const map={};
  rows.forEach(r=>{
    const key=`${r.product}||${r.video}`;
    if(!map[key])map[key]={product:r.product,video:r.video,mkt:r._mkt,rows:[]};
    map[key].rows.push(r);
  });
  return Object.values(map).map(g=>{
    const m=sumRows(g.rows);
    const revenue=calcRevenue(m.results,g.product);
    const roas=m.amount_spent?revenue/m.amount_spent:0;
    const frequency=m.reach>0?m.impressions/m.reach:0;
    const driveUrl=S.driveLinks[g.video]||S.driveLinks[g.video?.toLowerCase()]||'';
    const info=findProduct(g.product)||PRODUCTS_DEF.find(p=>p.code===g.product)||PRODUCTS_DEF.find(p=>normCode(p.code)===normCode(g.product))||{label:g.product,color:'#666'};
    return{...m,product:g.product,prodLabel:info.label,prodColor:info.color,video:g.video,mkt:g.mkt,revenue,roas,frequency,driveUrl};
  }).sort((a,b)=>b.results-a.results);
}

function aggOverall(rows){
  const m=sumRows(rows);
  const revenue=rows.reduce((s,r)=>s+calcRevenue(parseNum(r.results),r.product),0);
  const roas=m.amount_spent?revenue/m.amount_spent:0;
  return{...m,revenue,roas};
}

function renderView(){
  const el=document.getElementById('content');
  if(S.loading){el.innerHTML='<div class="loading-txt">Đang tải dữ liệu...</div>';return;}
  const nav=S.nav;
  if(nav==='overview')renderOverview(el);
  else if(nav==='by-product')renderByProduct(el);
  else if(nav==='by-mkt')renderByMKT(el);
  else if(nav==='by-video')renderByVideo(el);
  else if(nav==='upload')renderUpload(el);
  else if(nav==='cfg-products')renderCfgProducts(el);
  else if(nav==='cfg-drive')renderCfgDrive(el);
  else if(nav==='cfg-users')renderCfgUsers(el);
}

// ═══════════════════════════════════════════════
//  VIDEO SCORING & RECOMMENDATIONS
// ═══════════════════════════════════════════════
function videoScore(v,avgCpr){
  const recs=[];let score=100;
  const hasPrice=getAvgOrder(v.product)>0;
  const freq=v.frequency||0;
  const ctr=v.ctr||0;
  const cpr=v.cpr||0;

  // CTR — Hook video
  if(ctr<0.003){score-=30;recs.push({sev:'c',tag:'Hook',msg:`CTR ${fPct(ctr)} — Hook rất yếu`,act:'Đổi 3 giây đầu video + thumbnail ngay. Thử câu hỏi mạnh hoặc cảnh gây tò mò.'});}
  else if(ctr<0.007){score-=15;recs.push({sev:'w',tag:'Hook',msg:`CTR ${fPct(ctr)} — Hook chưa thu hút`,act:'Thử A/B test hook mới: đặt câu hỏi trực tiếp vào pain point khách hàng.'});}
  else if(ctr<0.015){score-=5;recs.push({sev:'w',tag:'Hook',msg:`CTR ${fPct(ctr)} — Hook trung bình`,act:'Cải thiện thêm: thêm subtitle nổi bật, đổi màu sắc thumbnail.'});}
  else recs.push({sev:'g',tag:'Hook',msg:`CTR ${fPct(ctr)} — Hook tốt`,act:'Giữ nguyên hook, scale ngân sách.'});

  // Frequency — Creative fatigue
  if(freq>4){score-=25;recs.push({sev:'c',tag:'Fatigue',msg:`Tần suất ${freq.toFixed(1)}x — Creative fatigue nghiêm trọng`,act:'Tạm dừng video này ngay. Tạo creative mới hoàn toàn khác (đổi góc quay, người dẫn, story).'});}
  else if(freq>2.5){score-=10;recs.push({sev:'w',tag:'Fatigue',msg:`Tần suất ${freq.toFixed(1)}x — Audience bắt đầu nhàm`,act:'Chuẩn bị 1-2 video thay thế. Cân nhắc mở rộng audience.'});}
  else if(freq>0)recs.push({sev:'g',tag:'Fatigue',msg:`Tần suất ${freq.toFixed(1)}x — Chưa bão hoà`,act:'Tiếp tục chạy.'});

  // CPR so với mục tiêu 42% giá SP
  const avgOrder=getAvgOrder(v.product);
  const targetCpr=avgOrder*0.42;
  if(targetCpr>0&&cpr>0){
    const ratio=cpr/targetCpr;
    if(ratio>1.5){score-=25;recs.push({sev:'c',tag:'CPA',msg:`CPR ${fVND(cpr)} — Vượt mục tiêu ${ratio.toFixed(1)}x (CPA mục tiêu: ${fVND(targetCpr)})`,act:'Tối ưu landing page, CTA và nội dung chốt đơn. Xem lại target audience.'});}
    else if(ratio>1.0){score-=12;recs.push({sev:'w',tag:'CPA',msg:`CPR ${fVND(cpr)} — Chưa đạt CPA mục tiêu ${fVND(targetCpr)}`,act:'Thêm offer hấp dẫn hơn, cải thiện phần chốt đơn trong video.'});}
    else recs.push({sev:'g',tag:'CPA',msg:`CPR ${fVND(cpr)} ≤ ${fVND(targetCpr)} — Đạt CPA mục tiêu (42% giá SP)`,act:'Duy trì và có thể tăng ngân sách.'});
  }else if(avgCpr>0&&cpr>0){
    // Fallback khi chưa cài giá SP: so với trung bình tuần
    const ratio=cpr/avgCpr;
    if(ratio>3){score-=20;recs.push({sev:'c',tag:'CPA',msg:`CPR cao hơn trung bình ${ratio.toFixed(1)}x (chưa cài giá SP)`,act:'Kiểm tra target audience, landing page và CTA cuối video.'});}
    else if(ratio>1.8){score-=10;recs.push({sev:'w',tag:'CPA',msg:`CPR cao hơn trung bình ${ratio.toFixed(1)}x`,act:'Tối ưu CTA, thử thêm offer hấp dẫn hơn.'});}
    else if(ratio<0.7)recs.push({sev:'g',tag:'CPA',msg:`CPR thấp hơn trung bình ${(1/ratio).toFixed(1)}x`,act:'Video hiệu quả — tăng ngân sách để scale.'});
  }

  // ROAS — mục tiêu 2.38x (= 1/42% break-even)
  if(hasPrice){
    if(v.roas>0&&v.roas<1){score-=30;recs.push({sev:'c',tag:'ROAS',msg:`ROAS ${v.roas.toFixed(2)}x — Đang lỗ vốn`,act:'Dừng ngay hoặc cắt giảm ngân sách. Xem lại giá bán, offer và nội dung chốt đơn.'});}
    else if(v.roas>=1&&v.roas<2.38){score-=10;recs.push({sev:'w',tag:'ROAS',msg:`ROAS ${v.roas.toFixed(2)}x — Chưa đạt mục tiêu 2.38x`,act:'Tối ưu nội dung chốt đơn, thêm social proof (đánh giá, before/after), cải thiện offer.'});}
    else if(v.roas>=2.38&&v.roas<4)recs.push({sev:'g',tag:'ROAS',msg:`ROAS ${v.roas.toFixed(2)}x — Đạt mục tiêu`,act:'Tốt, duy trì. Thử nâng giá hoặc upsell để cải thiện thêm.'});
    else if(v.roas>=4)recs.push({sev:'g',tag:'ROAS',msg:`ROAS ${v.roas.toFixed(2)}x — Xuất sắc`,act:'Scale ngân sách mạnh. Tạo thêm video tương tự.'});
  }

  // CPM — Chi phí hiển thị
  if(v.cpm>200000){score-=10;recs.push({sev:'w',tag:'CPM',msg:`CPM ${fVND(v.cpm)} — Chi phí hiển thị cao`,act:'Thử mở rộng audience, lookalike mới hoặc đổi vị trí quảng cáo.'});}

  // Spend nhưng 0 kết quả
  if(v.results===0&&v.amount_spent>500000){score-=25;recs.push({sev:'c',tag:'Kết quả',msg:`0 đơn sau ${fVND(v.amount_spent)} chi tiêu`,act:'Kiểm tra ngay: pixel tracking, landing page, nội dung CTA và target audience.'});}

  score=Math.max(0,score);
  const level=score>=70?'g':score>=40?'w':'c';
  return{score,level,recs};
}

function recSevStyle(sev){
  if(sev==='c')return'background:#fef2f2;border-left:3px solid #ef4444;color:#991b1b;';
  if(sev==='w')return'background:#fffbeb;border-left:3px solid #f59e0b;color:#92400e;';
  return'background:#f0fdf4;border-left:3px solid #22c55e;color:#166534;';
}
function recSevIcon(sev){return sev==='c'?'🔴':sev==='w'?'🟡':'🟢';}
function healthLabel(level,score){
  if(level==='g')return`<span style="background:#dcfce7;color:#166534;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">✅ Tốt (${score}đ)</span>`;
  if(level==='w')return`<span style="background:#fef9c3;color:#854d0e;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">⚠ Cần tối ưu (${score}đ)</span>`;
  return`<span style="background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">🚨 Cần cải thiện gấp (${score}đ)</span>`;
}

  return`<div style="background:var(--surf2);border-radius:8px;padding:8px 10px;text-align:center;">
    <div style="font-size:10px;color:var(--muted);margin-bottom:2px;">${label}</div>

function setFilter(p){S.filterProd=p;renderView();}
function sortArrow(col){return S.sortCol===col?(S.sortDir>0?'↓':'↑'):'↕';}
function sortVideo(col){if(S.sortCol===col)S.sortDir*=-1;else{S.sortCol=col;S.sortDir=-1;}renderView();}
function sortedVideos(vids){
  if(!S.sortCol)return vids;
  if(S.sortCol==='score'){
    return[...vids].sort((a,b)=>{
      const sa=videoScore(a,0).score,sb=videoScore(b,0).score;
      return S.sortDir*(sa-sb);
    });
  }
  return[...vids].sort((a,b)=>S.sortDir*((a[S.sortCol]||0)-(b[S.sortCol]||0)));
}

function handleCSV(e){const f=e.target.files[0];if(f)processCSVFile(f);}

function processCSVFile(file){
  Papa.parse(file,{
    header:true,skipEmptyLines:true,
    complete(res){
      csvCols=detectColumns(res.meta.fields||[]);
      // Fallback: use campaign column as row name if ad_name not present
      const _nameCol=csvCols.ad_name||csvCols.campaign;
      csvRows=res.data.filter(row=>(row[_nameCol]||'').trim()!=='');
      const dateStart=csvRows[0]?csvRows[0][csvCols.date_start]:'';
      const weekGuess=isoWeek(dateStart)||'';
      if(weekGuess){
        const inp=document.getElementById('upload-week');
        if(inp)inp.value=weekGuess;
      }
      // col map info
      const info=Object.entries(csvCols).filter(([k,v])=>v).map(([k,v])=>`<b>${k}</b>→${v}`).join(' · ');
      const colInfoEl=document.getElementById('col-map-info');
      if(colInfoEl){colInfoEl.style.display='';colInfoEl.innerHTML='Cột phát hiện: '+info;}
      // preview
      showCSVPreview();
      document.getElementById('csv-preview').style.display='';
      setAlert('upload-alert','',null);
    },
    error(e){setAlert('upload-alert','Lỗi đọc CSV: '+e.message);}
  });
}

function detectColumns(fields){
  const map={};
  const nc=s=>s.normalize('NFC').toLowerCase().trim();
  for(const[key,aliases]of Object.entries(COL_ALIASES)){
    for(const f of fields){
      if(aliases.some(a=>nc(f)===nc(a))){map[key]=f;break;}
    }
    if(!map[key]){
      for(const f of fields){
        if(aliases.some(a=>nc(f).includes(nc(a).slice(0,10)))){map[key]=f;break;}
      }
    }
  }
  return map;
}

function showCSVPreview(){
  if(!csvRows||!csvRows.length)return;
  const cols=csvCols;
  const _nc=cols.ad_name||cols.campaign;
  const preview=csvRows.slice(0,5).map(row=>{
    const _n=row[_nc]||'';
    const {product,video}=parseAdName(_n);
    return{ad:_n,product,video,

function cancelUpload(){csvRows=null;csvCols={};document.getElementById('csv-preview').style.display='none';}

async function doUpload(){
  const mkt=document.getElementById('mkt-name').value.trim();
  let week=(document.getElementById('upload-week').value||'').trim();
  if(!mkt){setAlert('upload-alert','Vui lòng nhập tên MKT.');return;}
  if(!week){setAlert('upload-alert','Vui lòng chọn hoặc nhập tuần.');return;}
  if(!csvRows||!csvRows.length){setAlert('upload-alert','Chưa có dữ liệu CSV.');return;}
  setAlert('upload-alert','','s');
  const cols=csvCols;
  const rows=csvRows.map(row=>{
    const _n=row[cols.ad_name]||row[cols.campaign]||'';
    const {product,video}=parseAdName(_n);
    return{
      ad_name:_n,product,video,
      campaign:row[cols.campaign]||'',adset:row[cols.adset]||'',
      impressions:parseNum(row[cols.impressions]),
      reach:parseNum(row[cols.reach]),
      frequency:parseNum(row[cols.frequency]),
      amount_spent:parseNum(row[cols.amount_spent]),
      cpm:parseNum(row[cols.cpm]),
      cpc:parseNum(row[cols.cpc]),
      ctr:parseNum(row[cols.ctr])/100,
      link_clicks:parseNum(row[cols.link_clicks]),
      results:parseNum(row[cols.results]),
      cost_per_result:parseNum(row[cols.cost_per_result]),
      result_type:row[cols.result_type]||'',
    };
  });
  setAlert('upload-alert','⏳ Đang lưu dữ liệu...','s');
  try{
    const id=`${safeId(week)}_${safeId(mkt)}_${Date.now()}`;
    await S.db.doc(`reports/${id}`).set({week,mkt,rows,uploaded_by:S.user.name,uploaded_at:Date.now()});
  }catch(e){
    const msg=e.message||String(e);
    const isPermErr=/permission|denied|unauthorized|not_granted/i.test(msg);
    setAlert('upload-alert', isPermErr
      ? '❌ Không có quyền ghi dữ liệu. Vui lòng <a href="https://claude.ai" target="_blank" style="color:inherit;text-decoration:underline;">đăng nhập claude.ai</a> rồi thử lại.'
      : '❌ Lỗi lưu báo cáo: '+msg);
    return;
  }
  // Cập nhật danh sách tuần (không-critical, không dừng nếu lỗi)
  try{
    if(!S.weeks.includes(week)){
      S.weeks=[...S.weeks,week];S.weeks.sort((a,b)=>b.localeCompare(a));
      const ms=await S.db.doc('config/meta').get();
      const md=ms.exists?ms.data():{};
      await S.db.doc('config/meta').set({...md,weeks:S.weeks,initialized:true});
      rebuildWeekSelect();
    }
  }catch(e){console.warn('config/meta update failed:',e);}
  setAlert('upload-alert',`✓ Upload thành công ${rows.length} dòng cho tuần ${week}, MKT: ${mkt}`,'s');
  S.week=week;
  rebuildWeekSelect();
  await loadWeekData();
  cancelUpload();
  loadUploadHistory();
  setTimeout(()=>goNav('overview'),300);
}

function confirmDelete(id,week){
  showConfirm(`Xóa báo cáo tuần <b>${week}</b>?<br><span class="small muted">Thao tác không thể hoàn tác.</span>`,()=>deleteReport(id,week));
}
async function deleteReport(id,week){
  try{
    await S.db.doc(`reports/${id}`).delete();
  }catch(e){showAlert('Lỗi khi xóa: '+e.message);return;}
  // After successful delete, try to clean up week list (non-critical)
  try{
    const snap=await S.db.collection('reports').where('week','==',week).limit(1).get();
    if(snap.empty){
      S.weeks=S.weeks.filter(w=>w!==week);
      const ms=await S.db.doc('config/meta').get();
      const md=ms.exists?ms.data():{};
      await S.db.doc('config/meta').set({...md,weeks:S.weeks,initialized:true});
      rebuildWeekSelect();
    }
  }catch(e){}
  if(S.week===week){S.weekRows=[];renderView();}
  loadUploadHistory();
}

  el.innerHTML='<div class="loading-txt">Đang tải...</div>';
  const snap=await S.db.collection('users').get();
  el.innerHTML=`
  <div style="max-width:580px;">
    <div class="card">
      <div class="card-hd">
        <div class="card-ttl">Tài khoản nhân viên</div>
        <button class="btn btn-p btn-sm" onclick="openUserModal()">+ Thêm tài khoản</button>
      </div>
      <div id="user-alert"></div>
      <div class="tbl-wrap">
        <table><thead><tr><th>Tên</th><th>Username</th><th>Vai trò</th><th></th></tr></thead>
        <tbody>${snap.docs.map(d=>{const u=d.data();const uname=u.n||u.name||d.id;const urole=u.r||u.role||'staff';return`<tr>
          <td class="bold">${uname}</td>
          <td>${d.id}</td>
          <td><span class="badge ${urole==='admin'?'badge-b':'badge-gray'}">${urole==='admin'?'Admin':'Nhân viên'}</span></td>
          <td>
            ${d.id!==S.user.id?`<button class="btn btn-d btn-sm" onclick="deleteUser('${d.id}','${u.name}')">Xóa</button>`:'<span class="small muted">(bạn)</span>'}
          </td>
        </tr>`}).join('')}</tbody></table>
      </div>
    </div>
  </div>
  <div id="user-modal"></div>`;
}

function openUserModal(){
  document.getElementById('user-modal').innerHTML=`
  <div class="modal-bg" onclick="closeUserModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-ttl">Thêm tài khoản</div>
      <div id="um-alert"></div>
      <div class="fg"><label class="lbl">Họ tên</label><input class="inp" id="um-name" placeholder="Nguyễn Văn A"></div>
      <div class="fg"><label class="lbl">Tên đăng nhập</label><input class="inp" id="um-user" placeholder="username"></div>
      <div class="fg"><label class="lbl">Mật khẩu (tối thiểu 6 ký tự)</label><input class="inp" id="um-pass" type="password"></div>
      <div class="fg">
        <label class="lbl">Vai trò</label>
        <select class="sel" id="um-role"><option value="staff">Nhân viên</option><option value="admin">Quản trị</option></select>
      </div>
      <div class="modal-foot">
        <button class="btn btn-s" onclick="closeUserModal()">Hủy</button>
        <button class="btn btn-p" onclick="saveUser()">Tạo tài khoản</button>
      </div>
    </div>
  </div>`;
}
function closeUserModal(){const el=document.getElementById('user-modal');if(el)el.innerHTML='';}
async function saveUser(){
  const name=document.getElementById('um-name').value.trim();
  const user=document.getElementById('um-user').value.trim();
  const pass=document.getElementById('um-pass').value;
  const role=document.getElementById('um-role').value;
  if(!name||!user||!pass){setAlert('um-alert','Vui lòng nhập đầy đủ.');return;}
  if(!/^[a-zA-Z0-9_.\-]{1,50}$/.test(user)){setAlert('um-alert','Username chỉ dùng chữ không dấu, số, dấu _.');return;}
  if(pass.length<6){setAlert('um-alert','Mật khẩu ít nhất 6 ký tự.');return;}
  try{
    const h=await sha256(pass);
    const snap=await S.db.doc(`users/${user}`).get();
    if(snap.exists)throw new Error('Username đã tồn tại');
    await S.db.doc(`users/${user}`).set({n:name,ph:h,r:role,c:Date.now()});
    closeUserModal();
    renderCfgUsers(document.getElementById('content'));
  }catch(e){setAlert('um-alert','Lỗi: '+e.message);}
}
function deleteUser(id,name){
  showConfirm(`Xóa tài khoản "<b>${name}</b>" (${id})?`,async()=>{
    try{
      await S.db.doc(`users/${id}`).delete();
      renderCfgUsers(document.getElementById('content'));
    }catch(e){showAlert('Lỗi: '+e.message);}
  });
}

// keyboard submit on login
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const authVisible=!document.getElementById('auth-wrap').hasAttribute('hidden');
    if(authVisible){
      if(document.getElementById('setup-form').style.display!=='none')doSetup();
      else doLogin();
    }
  }
});
</script>
